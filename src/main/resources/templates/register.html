<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Employee Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .register-card {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .register-card h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #3498db; }
        .error-text {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
        }
        .btn-register {
            width: 100%;
            padding: 11px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-register:hover { background-color: #219150; }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #7f8c8d;
        }
        .footer-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Create Account</h2>

        <form th:action="@{/register}" th:object="${userDto}" method="POST">
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" th:field="*{username}" placeholder="Choose a username" autofocus />
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-text"></p>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Create password" />
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text"></p>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" th:field="*{confirmPassword}" placeholder="Repeat password" />
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="error-text"></p>
            </div>

            <button type="submit" class="btn-register">Sign Up</button>
        </form>

        <div class="footer-link">
            Already have an account? <a th:href="@{/login}">Login here</a>
        </div>
    </div>

</body>
</html>
