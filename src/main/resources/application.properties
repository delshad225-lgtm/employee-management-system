# 1. Application Name & Port
spring.application.name=Employee Management System
# 2. Dynamic Datasource Configuration (Local aur Cloud dono par chalega)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Render ke liye dynamic port (Local par 8080 rahega, Render par uska port milega)
server.port=${PORT:8080}

# 3. Hibernate / JPA Configuration
# DDL mode: controls automatic schema creation
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in console (great for learning and debugging)
spring.jpa.show-sql=true
# Format SQL queries so they are readable
spring.jpa.properties.hibernate.format_sql=true

# 4. Thymeleaf Cache Configuration
# Set to false during development so changes to HTML reflect immediately on refresh
spring.thymeleaf.cache=false


# 5. File Upload Configuration (Max 5MB per photo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB